ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    androidxCoreKTXVersion = project.hasProperty('androidxCoreKTXVersion') ? rootProject.ext.androidxCoreKTXVersion : '1.17.0'
    androidxExifInterfaceVersion = project.hasProperty('androidxExifInterfaceVersion') ? rootProject.ext.androidxExifInterfaceVersion : '1.4.2'
    mlkitTextRecognitionVersion = project.hasProperty('mlkitTextRecognitionVersion') ? rootProject.ext.mlkitTextRecognitionVersion : '16.0.1'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Script models beyond Latin are opt-in, since each adds several MB to the app. Enable them in the
// app's variables.gradle (or any rootProject.ext block), e.g. `nativeOcrChinese = true`.
def nativeOcrFlag(String name) {
    return rootProject.ext.has(name) && rootProject.ext.get(name).toString().toBoolean()
}
def nativeOcrScripts = [
    chinese: nativeOcrFlag('nativeOcrChinese'),
    devanagari: nativeOcrFlag('nativeOcrDevanagari'),
    japanese: nativeOcrFlag('nativeOcrJapanese'),
    korean: nativeOcrFlag('nativeOcrKorean'),
]

android {
    namespace = "dev.motiko.nativeocr"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
        nativeOcrScripts.each { script, enabled ->
            buildConfigField "boolean", "OCR_${script.toUpperCase()}", enabled.toString()
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // The recognition tests read the same fixture images as the iOS tests.
    sourceSets {
        androidTest.assets.srcDirs += '../ios/Tests/NativeOcrPluginTests/Fixtures'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    google()
    mavenCentral()
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreKTXVersion"
    implementation "androidx.exifinterface:exifinterface:$androidxExifInterfaceVersion"
    implementation "com.google.mlkit:text-recognition:$mlkitTextRecognitionVersion"
    // The code references every script model; only the enabled ones ship in the app.
    nativeOcrScripts.each { script, enabled ->
        def dependency = "com.google.mlkit:text-recognition-$script:$mlkitTextRecognitionVersion"
        if (enabled) {
            implementation dependency
        } else {
            compileOnly dependency
        }
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:runner:1.7.0"
}
