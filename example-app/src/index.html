<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Native OCR example</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <style>
      body {
        font: 16px -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      }
      fieldset {
        border: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      #stage {
        position: relative;
        margin-top: 16px;
      }
      #stage img,
      #stage canvas {
        width: 100%;
        display: block;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        height: 100%;
      }
      pre {
        white-space: pre-wrap;
        background: #f2f2f2;
        padding: 12px;
        border-radius: 8px;
      }
      #bench-table {
        border-collapse: collapse;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      #bench-table td,
      #bench-table th {
        padding: 4px 8px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      #bench-output {
        width: 100%;
        font: 12px ui-monospace, monospace;
      }
      .muted {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Native OCR</h1>
    <p id="status" class="muted">Checking availability…</p>
    <fieldset>
      <label>Image <input type="file" id="file" accept="image/*" /></label>
      <label>Languages <input type="text" id="languages" placeholder="de-DE, en-US (empty: detect)" /></label>
      <label>
        Level
        <select id="level">
          <option value="accurate">accurate</option>
          <option value="fast">fast</option>
        </select>
      </label>
      <label><input type="checkbox" id="correction" checked /> Language correction</label>
      <button id="run" disabled>Recognize</button>
    </fieldset>
    <div id="stage">
      <img id="preview" alt="" />
      <canvas id="overlay"></canvas>
    </div>
    <p id="summary" class="muted"></p>
    <pre id="text"></pre>
    <section id="bench" hidden>
      <h2>Benchmark</h2>
      <p id="bench-name" class="muted"></p>
      <button id="bench-run">Run benchmark</button>
      <button id="bench-copy" disabled>Copy results</button>
      <p id="bench-status" class="muted"></p>
      <table id="bench-table"></table>
      <textarea id="bench-output" rows="6" readonly hidden></textarea>
    </section>
    <details>
      <summary>Supported languages</summary>
      <p id="supported" class="muted"></p>
    </details>
    <script src="./js/example.js" type="module"></script>
  </body>
</html>
