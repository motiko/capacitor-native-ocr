<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Native OCR example</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <style>
      body {
        font: 16px -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      }
      fieldset {
        border: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      #stage {
        position: relative;
        margin-top: 16px;
      }
      #stage img,
      #stage canvas {
        width: 100%;
        display: block;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        height: 100%;
      }
      pre {
        white-space: pre-wrap;
        background: #f2f2f2;
        padding: 12px;
        border-radius: 8px;
      }
      .muted {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Native OCR</h1>
    <p id="status" class="muted">Checking availability…</p>
    <fieldset>
      <label>Image <input type="file" id="file" accept="image/*" /></label>
      <label>Languages <input type="text" id="languages" placeholder="de-DE, en-US (empty: detect)" /></label>
      <label>
        Level
        <select id="level">
          <option value="accurate">accurate</option>
          <option value="fast">fast</option>
        </select>
      </label>
      <label><input type="checkbox" id="correction" checked /> Language correction</label>
      <button id="run" disabled>Recognize</button>
    </fieldset>
    <div id="stage">
      <img id="preview" alt="" />
      <canvas id="overlay"></canvas>
    </div>
    <p id="summary" class="muted"></p>
    <pre id="text"></pre>
    <details>
      <summary>Supported languages</summary>
      <p id="supported" class="muted"></p>
    </details>
    <script src="./js/example.js" type="module"></script>
  </body>
</html>
